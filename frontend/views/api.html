<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
<main class="mx-auto max-w-6xl px-4 py-8">
    <header class="mb-8">
        <p class="text-sm font-semibold uppercase tracking-wide text-green-600">External API</p>
        <h1 class="text-3xl font-bold">Rick and Morty Explorer</h1>
        <p class="mt-2 text-slate-600">Search characters. Results update four seconds after typing stops.</p>
        <nav class="mt-5 flex flex-wrap gap-3 border-t border-slate-200 pt-4">
            <a class="inline-block rounded-lg bg-green-600 px-4 py-2 font-semibold text-white hover:bg-green-700"
               href="index.html">Hardware Catalog</a>
        </nav>
    </header>

    <label class="mb-6 block">
        <span class="mb-2 block font-semibold">Search characters</span>
        <input id="character-search" class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3"
               type="search" placeholder="Try Rick, Morty, or Summer">
    </label>

    <p id="explorer-message" class="mb-4 text-slate-600">Type a name to search.</p>
    <section id="character-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-live="polite"></section>
</main>
<dialog id="character-modal" class="w-11/12 max-w-2xl rounded-xl p-0 shadow-xl">
    <div id="character-modal-content" class="p-6"></div>
</dialog>
<script type="module" src="../services/api.service.js"></script>
</body>
</html>
